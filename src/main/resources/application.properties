spring.application.name=LibraryManagementSystem
spring.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - the default below is for local development only.
# Override JWT_SECRET with your own value (32+ chars) before running anywhere shared/production.
jwt.secret=${JWT_SECRET:k7fD2mQ9xZ4pL8vR1nC6tE3wA5yU0jH9sK2gN7bV4rM1qX8dW6zY3fT5cP0oI9lJ4hG7uS2}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Bootstrap for the first ADMIN account, created on startup if no ADMIN exists yet.
# The defaults below are a ready-to-use LOCAL DEV test admin - override ADMIN_EMAIL/ADMIN_PASSWORD
# (or clear them) before running anywhere shared/production.
app.admin.email=${ADMIN_EMAIL:admin@bookstore.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}